<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mãos que Falam, Cantam e Escrevem</title>
</head>
<body>
<p id="status" style="font-family:Arial,sans-serif;text-align:center;padding:30px">Carregando o projeto…</p>
<script>
(async function () {
  const status = document.getElementById('status');
  try {
    const response = await fetch('index-original.html', { cache: 'no-store' });
    if (!response.ok) throw new Error('index-original.html não encontrado');

    const source = await response.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(source, 'text/html');

    function setImage(selector, src, alt) {
      const img = doc.querySelector(selector);
      if (!img) return false;
      img.setAttribute('src', src);
      if (alt) img.setAttribute('alt', alt);
      return true;
    }

    // ABERTURA: capa e história ilustrada são arquivos diferentes.
    setImage('#prefacio .intro img', 'capaabertura.png', 'Capa da Abertura — Projeto Duda');
    setImage('#ilustrada-prefacio .story-illustration', 'abertura.png', 'História ilustrada da Abertura');

    // NOVAS CAPAS — Capítulos 1 a 5.
    setImage('#cap1 .chapter-image img', 'capa-capitulo-1.png', 'Capa do Capítulo 1');
    setImage('#cap2 .chapter-image img', 'capa-capitulo-2.png', 'Capa do Capítulo 2');
    setImage('#cap3 .chapter-image img', 'capa-capitulo-3.png', 'Capa do Capítulo 3');
    setImage('#cap4 .chapter-image img', 'capa-capitulo-4.png', 'Capa do Capítulo 4');
    setImage('#cap5 .chapter-image img', 'capa-capitulo-5.png', 'Capa do Capítulo 5');

    // HISTÓRIAS ILUSTRADAS — permanecem separadas das novas capas.
    setImage('#ilustrada1 .story-illustration', 'cap1 02.png', 'História ilustrada do Capítulo 1');
    setImage('#ilustrada2 .story-illustration', 'cap2(1).png', 'História ilustrada do Capítulo 2');
    setImage('#ilustrada3 .story-illustration', 'cap3 02.png', 'História ilustrada do Capítulo 3');
    setImage('#ilustrada4 .story-illustration', 'cap4.png', 'História ilustrada do Capítulo 4');
    setImage('#ilustrada5 .story-illustration', 'cap5.png', 'História ilustrada do Capítulo 5');

    // BÔNUS — NÃO ALTERAR.
    setImage('#bonus .chapter-image img', 'capabonus.png', 'Capa do Bônus — Literatura Surda Adaptada');
    setImage('#ilustradabonus .story-illustration', 'bonus(1).png', 'História ilustrada do Bônus');

    document.open();
    document.write('<!doctype html>' + doc.documentElement.outerHTML);
    document.close();
  } catch (error) {
    console.error(error);
    status.innerHTML = '<strong style="color:#a33">Não foi possível carregar o projeto.</strong><br>Verifique se <b>index-original.html</b> está no mesmo repositório.';
  }
})();
</script>
</body>
</html>
