<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mãos que Falam, Cantam e Escrevem</title>
</head>
<body>
<script>
fetch('index-final-.html', { cache: 'no-store' })
  .then(function (response) {
    if (!response.ok) throw new Error('Não foi possível carregar o conteúdo principal.');
    return response.text();
  })
  .then(function (html) {
    var parser = new DOMParser();
    var doc = parser.parseFromString(html, 'text/html');

    /* ABERTURA: história ilustrada correta, separada da capa. */
    var aberturaIlustrada = doc.querySelector('#ilustrada-prefacio .story-illustration');
    if (aberturaIlustrada) {
      aberturaIlustrada.setAttribute('src', 'historia-abertura.png');
      aberturaIlustrada.setAttribute('alt', 'Professora Thaís e Duda — História ilustrada da Abertura');
    }

    /* BÔNUS: capa e história ilustrada ficam separadas. */
    var bonusCapa = doc.querySelector('#bonus .chapter-image img');
    if (bonusCapa) {
      bonusCapa.setAttribute('src', 'capabonus.png');
      bonusCapa.setAttribute('alt', 'Capa do Bônus — Os Três Porquinhos');
    }

    var bonusIlustrada = doc.querySelector('#ilustradabonus .story-illustration');
    if (bonusIlustrada) {
      bonusIlustrada.setAttribute('src', 'bonus(1).png');
    }

    /* LER A HISTÓRIA COMPLETA = SOMENTE TEXTO. */
    doc.querySelectorAll('section.story-page[id^="historia"]').forEach(function (section) {
      section.querySelectorAll('img.story-illustration').forEach(function (img) {
        img.remove();
      });
    });

    /* VER A HISTÓRIA ILUSTRADA = SOMENTE A ILUSTRAÇÃO + BOTÃO DE VOLTAR. */
    doc.querySelectorAll('section.story-page[id^="ilustrada"]').forEach(function (section) {
      Array.from(section.children).forEach(function (child) {
        var manterImagem = child.matches && child.matches('img.story-illustration');
        var manterVoltar = child.matches && child.matches('a.story-back');
        if (!manterImagem && !manterVoltar) {
          child.remove();
        }
      });
    });

    /* NAVEGAÇÃO DO BÔNUS VOLTA SEMPRE AO BÔNUS, NÃO AO CAPÍTULO 4. */
    ['historiabonus', 'ilustradabonus'].forEach(function (id) {
      var section = doc.getElementById(id);
      if (!section) return;
      var voltar = section.querySelector('a.story-back');
      if (voltar) {
        voltar.setAttribute('href', '#bonus');
        voltar.textContent = '← Voltar ao Bônus';
      }
    });

    /* ÁUDIOS DO BÔNUS: nomes oficiais restaurados no repositório. */
    var bonusAudios = doc.querySelectorAll('#bonus audio source');
    if (bonusAudios[0]) bonusAudios[0].setAttribute('src', 'bonus-1.mpeg');
    if (bonusAudios[1]) bonusAudios[1].setAttribute('src', 'bonus-2.mpeg');

    document.open();
    document.write('<!doctype html>' + doc.documentElement.outerHTML);
    document.close();
  })
  .catch(function (error) {
    document.body.innerHTML =
      '<p style="font-family:Arial,sans-serif;padding:30px">Não foi possível carregar o projeto. Atualize a página e tente novamente.</p>';
    console.error(error);
  });
</script>
</body>
</html>
