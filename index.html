<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mãos que Falam, Cantam e Escrevem</title>
</head>
<body>
<script>
fetch('index-final-.html', { cache: 'no-store' })
  .then(function (response) {
    if (!response.ok) throw new Error('Não foi possível carregar o conteúdo principal.');
    return response.text();
  })
  .then(function (html) {
    var parser = new DOMParser();
    var doc = parser.parseFromString(html, 'text/html');

    var aberturaIlustrada = doc.querySelector('#ilustrada-prefacio .story-illustration');
    if (aberturaIlustrada) {
      aberturaIlustrada.setAttribute('src', 'historia-abertura.png');
      aberturaIlustrada.setAttribute('alt', 'Professora Thaís e Duda — História ilustrada da Abertura');
    }

    var historias = {
      '#ilustrada1 .story-illustration': 'historia-capitulo-1.png',
      '#ilustrada2 .story-illustration': 'historia-capitulo-2.png',
      '#ilustrada3 .story-illustration': 'historia-capitulo-3.png',
      '#ilustrada4 .story-illustration': 'historia-capitulo-4.png',
      '#ilustrada5 .story-illustration': 'historia-capitulo-5.png'
    };
    Object.keys(historias).forEach(function (selector) {
      var img = doc.querySelector(selector);
      if (img) img.setAttribute('src', historias[selector]);
    });

    var bonusCapa = doc.querySelector('#bonus .chapter-image img');
    if (bonusCapa) {
      bonusCapa.setAttribute('src', 'capa-bonus.png');
      bonusCapa.setAttribute('alt', 'Capa do Bônus — Os Três Porquinhos');
    }

    var bonusIlustrada = doc.querySelector('#ilustradabonus .story-illustration');
    if (bonusIlustrada) bonusIlustrada.setAttribute('src', 'historia-bonus.png');

    doc.querySelectorAll('section.story-page[id^="historia"]').forEach(function (section) {
      section.querySelectorAll('img.story-illustration').forEach(function (img) { img.remove(); });
    });

    doc.querySelectorAll('section.story-page[id^="ilustrada"]').forEach(function (section) {
      Array.from(section.children).forEach(function (child) {
        var manterImagem = child.matches && child.matches('img.story-illustration');
        var manterVoltar = child.matches && child.matches('a.story-back');
        if (!manterImagem && !manterVoltar) child.remove();
      });
    });

    ['historiabonus', 'ilustradabonus'].forEach(function (id) {
      var section = doc.getElementById(id);
      if (!section) return;
      var voltar = section.querySelector('a.story-back');
      if (voltar) {
        voltar.setAttribute('href', '#bonus');
        voltar.textContent = '← Voltar ao Bônus';
      }
    });

    var bonusAudios = doc.querySelectorAll('#bonus audio source');
    if (bonusAudios[0]) bonusAudios[0].setAttribute('src', 'bonus-1.mpeg');
    if (bonusAudios[1]) bonusAudios[1].setAttribute('src', 'bonus-2.mpeg');

    var destinos = [
      ['#prefacio', 0, 'musica-abertura'],
      ['#cap1', 0, 'musica-capitulo-1'],
      ['#cap2', 0, 'musica-capitulo-2'],
      ['#cap3', 0, 'musica-capitulo-3'],
      ['#cap4', 0, 'musica-capitulo-4'],
      ['#bonus', 0, 'musica-bonus-1'],
      ['#cap5', 0, 'musica-capitulo-5']
    ];
    destinos.forEach(function (item) {
      var section = doc.querySelector(item[0]);
      if (!section) return;
      var musicas = section.querySelectorAll('.music');
      if (musicas[item[1]]) {
        musicas[item[1]].setAttribute('id', item[2]);
        musicas[item[1]].style.scrollMarginTop = '110px';
      }
    });

    // Bônus 2: destino exclusivo pelo próprio arquivo de áudio.
    // Não depende da posição do player dentro do capítulo Bônus.
    var bonus2Source = Array.from(doc.querySelectorAll('#bonus audio source')).find(function (node) {
      var src = node.getAttribute('src') || '';
      return src.indexOf('bonus-2.mpeg') !== -1;
    });
    if (bonus2Source) {
      var bonus2Player = bonus2Source.closest('.music');
      if (bonus2Player) {
        bonus2Player.setAttribute('id', 'musica-bonus-2');
        bonus2Player.style.scrollMarginTop = '110px';
      }
    }

    var hashScript = doc.createElement('script');
    hashScript.textContent = "(function(){function ir(){var id=decodeURIComponent(location.hash.slice(1));if(!id)return;var el=document.getElementById(id);if(el){setTimeout(function(){el.scrollIntoView({behavior:'auto',block:'center'});},120);}}window.addEventListener('load',ir);setTimeout(ir,250);setTimeout(ir,700);})();";
    doc.body.appendChild(hashScript);

    document.open();
    document.write('<!doctype html>' + doc.documentElement.outerHTML);
    document.close();
  })
  .catch(function (error) {
    document.body.innerHTML = '<p style="font-family:Arial,sans-serif;padding:30px">Não foi possível carregar o projeto. Atualize a página e tente novamente.</p>';
    console.error(error);
  });
</script>
</body>
</html>
